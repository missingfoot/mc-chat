plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mcchat" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			programArgs "--username", "Host"
		}
		// Second dev client for testing two players on one machine: ./gradlew runClient2
		client2 {
			client()
			configName = "Minecraft Client 2"
			runDir "run2"
			programArgs "--username", "Friend"
		}
		// Client that joins the dev server directly: ./gradlew runClientJoin
		clientJoin {
			client()
			configName = "Minecraft Client (joins dev server)"
			programArgs "--username", "Host", "--quickPlayMultiplayer", "localhost"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

// Automated in-game checks: ./gradlew runClientGameTest (opens a real client, not shipped in the jar)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mcchat-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Local dedicated server with the dev Friend bot: ./gradlew runDevServer
// (declared after fabricApi.configureTests, which creates the gametest source set)
loom {
	runs {
		devServer {
			server()
			configName = "Dev Server + Friend bot"
			source sourceSets.gametest
			runDir "run-server"
			property "mcchat.friendbot", "true"
			programArgs "nogui"
		}
	}
}

// Offline-mode server settings for runDevServer (written once; edit run-server/server.properties freely)
def devServerDir = layout.projectDirectory.dir("run-server").asFile
tasks.register("prepareDevServer") {
	def dir = devServerDir
	doLast {
		dir.mkdirs()
		new File(dir, "eula.txt").text = "eula=true\n"
		def props = new File(dir, "server.properties")
		if (!props.exists()) {
			props.text = "online-mode=false\nmotd=MC Chat test server\nspawn-protection=0\ngamemode=creative\n"
		}
	}
}
tasks.matching { it.name == "runDevServer" }.configureEach { dependsOn "prepareDevServer" }
